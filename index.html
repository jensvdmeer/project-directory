<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project directory</title>
<style>
:root{--bg:#f6f8f5;--surface:#fff;--ink:#17261f;--muted:#5d6e64;--line:#d9e1db;--accent:#1f6f5c;--accent-ink:#fff;--chip:#eaf0eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a16;--surface:#18241f;--ink:#e8f0eb;--muted:#9bb0a4;--line:#2a3b33;--accent:#6fcfb2;--accent-ink:#0d1a14;--chip:#22322a}}
:root[data-theme="dark"]{--bg:#111a16;--surface:#18241f;--ink:#e8f0eb;--muted:#9bb0a4;--line:#2a3b33;--accent:#6fcfb2;--accent-ink:#0d1a14;--chip:#22322a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.group+.group{margin-top:12px}
.group h2{font-size:.95rem;margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible,.card:focus-visible,.clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;color:var(--muted);font-size:.95rem}
.clear{font:inherit;background:none;border:none;color:var(--accent);cursor:pointer;text-decoration:underline;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:inherit;text-decoration:none}
.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--chip)}
.ph{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;font-size:2.8rem;background:hsl(var(--h) 40% 55% / .3)}
.body{display:flex;flex-direction:column;gap:8px;padding:14px 16px;flex:1}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:1.1rem;font-family:Georgia,"Times New Roman",serif}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.eng{font-size:.85rem;font-weight:600;color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:.8rem;background:var(--chip);border-radius:4px;padding:1px 8px}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Projects</h1>
<p class="sub">Filter by how people were involved and by what the project studies.</p>
<div class="filters">
<div class="group"><h2>Engagement level</h2><div class="chips" id="eng"></div></div>
<div class="group"><h2>Project theme</h2><div class="chips" id="theme"></div></div>
</div>
<div class="bar"><span id="count"></span><button class="clear" id="clear" hidden>Clear filters</button></div>
<div class="grid" id="grid"></div>
</div>
<script>
// ===== EDIT HERE =====
// Replace each url with the path of the matching GitBook page, e.g. "/projects/my-project"
// To use your own cover image, add img:"https://..." to a project (16:9 works best). Without img, a placeholder with the theme icon is shown.
var ENGAGEMENT=["Contractual","Contributory","Collaborative","Co-Created","Collegial","Civic Engagement"];
var THEMES=["Heat stress","Soil monitoring","Transport","Noise pollution","Psychology","Social sciences","Biodiversity","Light pollution","Air quality","Water quality","Data processing","Energy"];
var PROJECTS=[
{title:"Cool Streets Sensors",eng:"Co-Created",themes:["Heat stress","Data processing"],text:"Residents help place and read temperature sensors along hot streets.",url:"#cool-streets"},
{title:"Schoolyard Soil Check",eng:"Contributory",themes:["Soil monitoring","Biodiversity"],text:"Pupils collect soil samples and log what lives in them.",url:"#soil-check"},
{title:"Quiet Routes",eng:"Collaborative",themes:["Noise pollution","Transport"],text:"Mapping commuter routes by noise level with local cyclists.",url:"#quiet-routes"},
{title:"Night Sky Neighbourhood",eng:"Civic Engagement",themes:["Light pollution","Biodiversity"],text:"Community counts of street lighting and its effect on wildlife.",url:"#night-sky"},
{title:"Clean Air Commutes",eng:"Contractual",themes:["Air quality","Transport"],text:"Commissioned air quality measurements on busy transport corridors.",url:"#clean-air"},
{title:"Canal Watchers",eng:"Contributory",themes:["Water quality"],text:"Volunteers take regular water samples along the canals.",url:"#canal-watchers"},
{title:"Wellbeing and Green Space",eng:"Collegial",themes:["Psychology","Social sciences"],text:"Researchers and practitioners studying how parks affect mood.",url:"#wellbeing"},
{title:"Neighbourhood Energy Lab",eng:"Co-Created",themes:["Energy","Social sciences"],text:"Households and researchers design energy saving experiments together.",url:"#energy-lab"},
{title:"Sensor Data Pipeline",eng:"Collegial",themes:["Data processing","Air quality","Noise pollution"],text:"Shared tools for cleaning and combining citizen sensor data.",url:"#pipeline"},
{title:"Heat and Health Survey",eng:"Collaborative",themes:["Heat stress","Psychology"],text:"Joint survey with care homes on coping with hot summers.",url:"#heat-health"},
{title:"Rain Garden Monitoring",eng:"Civic Engagement",themes:["Water quality","Soil monitoring"],text:"Neighbours track how rain gardens filter runoff.",url:"#rain-garden"},
{title:"Bike Lane Counts",eng:"Contractual",themes:["Transport","Data processing"],text:"Traffic counting service for the municipality.",url:"#bike-counts"}
];
// ===== END EDIT =====
var ICONS=["🌡️","🌱","🚲","🔊","🧠","👥","🦋","💡","🌫️","💧","📊","⚡"];
function cover(p){
  if(p.img){return '<img class="cover" src="'+esc(p.img)+'" alt="" loading="lazy">'}
  var i=Math.max(0,THEMES.indexOf(p.themes[0]));
  return '<div class="ph" style="--h:'+(i*30)+'" aria-hidden="true">'+ICONS[i%ICONS.length]+'</div>';
}
var sel={eng:[],theme:[]};
function chips(id,list,key){
  var box=document.getElementById(id);
  list.forEach(function(name){
    var b=document.createElement("button");
    b.className="chip";b.type="button";b.textContent=name;b.setAttribute("aria-pressed","false");
    b.onclick=function(){
      var i=sel[key].indexOf(name);
      if(i<0){sel[key].push(name)}else{sel[key].splice(i,1)}
      b.setAttribute("aria-pressed",i<0?"true":"false");render();
    };
    box.appendChild(b);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var out=PROJECTS.filter(function(p){
    var e=!sel.eng.length||sel.eng.indexOf(p.eng)>-1;
    var t=!sel.theme.length||p.themes.some(function(x){return sel.theme.indexOf(x)>-1});
    return e&&t;
  });
  document.getElementById("count").textContent=out.length+(out.length===1?" project":" projects");
  document.getElementById("clear").hidden=!(sel.eng.length||sel.theme.length);
  document.getElementById("grid").innerHTML=out.length?out.map(function(p){
    return '<a class="card" href="'+esc(p.url)+'" target="_top">'+cover(p)+'<div class="body"><span class="eng">'+esc(p.eng)+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.text)+'</p><div class="tags">'+p.themes.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div></div></a>';
  }).join(""):'<div class="empty">No projects match these filters. Remove a filter to see more.</div>';
}
document.getElementById("clear").onclick=function(){
  sel={eng:[],theme:[]};
  document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed","false")});
  render();
};
chips("eng",ENGAGEMENT,"eng");chips("theme",THEMES,"theme");render();
</script>
</body>
</html>
